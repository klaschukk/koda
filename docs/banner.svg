<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Koda — Plan your day in visual time blocks">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".6" stop-color="#0d1526"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".22"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#60a5fa;#a78bfa" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<radialGradient id="gl" cx=".2" cy=".1" r=".7"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.slide{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{from{transform:translateX(-10px);opacity:.55}to{transform:none;opacity:1}}
.float{animation:fl 3.6s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.fill{animation:fi 3s ease-in-out infinite alternate}@keyframes fi{from{width:14px}to{width:var(--w)}}
.in{opacity:0;animation:up .9s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#0b1020"/><rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#gr)"/><rect width="1200" height="300" fill="url(#gl)"/>
<g class="in"><text x="76" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#8b98a9">DESKTOP APP · macOS</text></g>
<text class="in" style="animation-delay:.15s" x="74" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#tt)">Koda</text>
<text class="in" style="animation-delay:.3s" x="76" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Plan your day in visual time blocks</text>
<g class="in" style="animation-delay:.45s"><rect x="76" y="222" width="100" height="32" rx="11" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".5"/><text x="126" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Electron</text><rect x="186" y="222" width="73" height="32" rx="11" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".5"/><text x="222" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">React</text><rect x="269" y="222" width="118" height="32" rx="11" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".5"/><text x="328" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">TypeScript</text><rect x="397" y="222" width="100" height="32" rx="11" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".5"/><text x="447" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Tailwind</text></g>
<line x1="770" y1="44" x2="770" y2="256" stroke="#fff" stroke-opacity=".07"/><line x1="870" y1="44" x2="870" y2="256" stroke="#fff" stroke-opacity=".07"/><line x1="970" y1="44" x2="970" y2="256" stroke="#fff" stroke-opacity=".07"/><line x1="1070" y1="44" x2="1070" y2="256" stroke="#fff" stroke-opacity=".07"/><rect class="slide" style="animation-delay:0.00s" x="770" y="60" width="120" height="46" rx="11" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".7"/><rect class="slide" style="animation-delay:0.22s" x="770" y="122" width="70" height="46" rx="11" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-opacity=".7"/><rect class="slide" style="animation-delay:0.44s" x="900" y="60" width="90" height="46" rx="11" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-opacity=".7"/><rect class="slide" style="animation-delay:0.66s" x="900" y="160" width="130" height="46" rx="11" fill="#fbbf24" fill-opacity=".22" stroke="#fbbf24" stroke-opacity=".7"/><rect class="slide" style="animation-delay:0.88s" x="1040" y="92" width="84" height="46" rx="11" fill="#f472b6" fill-opacity=".22" stroke="#f472b6" stroke-opacity=".7"/><rect class="slide" style="animation-delay:1.10s" x="1040" y="190" width="60" height="46" rx="11" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".7"/><g><line x1="0" y1="40" x2="0" y2="262" stroke="#f87171" stroke-width="2"/><circle cy="40" r="5" fill="#f87171"/><animateTransform attributeName="transform" type="translate" values="780 0;1150 0;780 0" dur="9s" repeatCount="indefinite"/></g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>